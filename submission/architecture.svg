<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9db4ff"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f87171"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#0b1020"/>
  <text x="30" y="38" fill="#fff" font-size="22" font-weight="700">VaultRAG — request flow with the Revocation-Safe Evidence Gate (RSEG)</text>
  <text x="30" y="60" fill="#9aa8d0" font-size="13">Runs on IBM LinuxONE Community Cloud (s390x, Ubuntu 24.04). SQLite is the authoritative permission store.</text>

  <rect x="30" y="90" width="150" height="70" rx="10" fill="#18223d" stroke="#6d8dff"/>
  <text x="105" y="120" fill="#fff" font-size="15" text-anchor="middle" font-weight="600">React / TS UI</text><text x="105" y="140" fill="#9aa8d0" font-size="12" text-anchor="middle">chat · vault · security</text>

  <rect x="230" y="90" width="170" height="70" rx="10" fill="#18223d" stroke="#6d8dff"/>
  <text x="315" y="120" fill="#fff" font-size="15" text-anchor="middle" font-weight="600">FastAPI</text><text x="315" y="140" fill="#9aa8d0" font-size="12" text-anchor="middle">token = user id only</text>
  <line x1="180" y1="125" x2="228" y2="125" stroke="#9db4ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="450" y="80" width="430" height="90" rx="10" fill="#16301f" stroke="#34d399"/>
  <text x="665" y="106" fill="#34d399" font-size="15" text-anchor="middle" font-weight="700">① Authorization service (DB = source of truth)</text>
  <text x="665" y="128" fill="#cfe9dc" font-size="12.5" text-anchor="middle">roles · ACL · per-user deny · doc / ACL / user versions</text>
  <text x="665" y="148" fill="#cfe9dc" font-size="12.5" text-anchor="middle">no admin read-bypass · fails CLOSED if down</text>
  <line x1="400" y1="125" x2="448" y2="125" stroke="#9db4ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="450" y="200" width="200" height="86" rx="10" fill="#18223d" stroke="#6d8dff"/>
  <text x="550" y="226" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">② Cache lookup</text>
  <text x="550" y="246" fill="#9aa8d0" font-size="12" text-anchor="middle">hit → REVALIDATE every</text><text x="550" y="263" fill="#9aa8d0" font-size="12" text-anchor="middle">dependency before serving</text>
  <rect x="680" y="200" width="200" height="86" rx="10" fill="#18223d" stroke="#6d8dff"/>
  <text x="780" y="226" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">③ Permission-first retrieval</text>
  <text x="780" y="246" fill="#9aa8d0" font-size="12" text-anchor="middle">search only allowed doc IDs;</text><text x="780" y="263" fill="#9aa8d0" font-size="12" text-anchor="middle">re-verify each candidate</text>
  <line x1="665" y1="170" x2="550" y2="198" stroke="#9db4ff" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="243" x2="678" y2="243" stroke="#9db4ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="450" y="320" width="200" height="86" rx="10" fill="#3a2a12" stroke="#fbbf24"/>
  <text x="550" y="346" fill="#fbbf24" font-size="14" text-anchor="middle" font-weight="700">④ Injection quarantine + PII</text>
  <text x="550" y="366" fill="#f3e3b8" font-size="12" text-anchor="middle">flagged chunks never reach the</text><text x="550" y="383" fill="#f3e3b8" font-size="12" text-anchor="middle">model; evidence = untrusted data</text>
  <line x1="780" y1="286" x2="600" y2="318" stroke="#9db4ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="680" y="320" width="200" height="86" rx="10" fill="#18223d" stroke="#6d8dff"/>
  <text x="780" y="346" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">⑤ LLM (Groq / any OpenAI-</text><text x="780" y="363" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">compatible) · no tools</text>
  <text x="780" y="386" fill="#9aa8d0" font-size="12" text-anchor="middle">answer buffered, never streamed</text>
  <line x1="650" y1="363" x2="678" y2="363" stroke="#9db4ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="450" y="440" width="430" height="100" rx="10" fill="#3b1620" stroke="#f87171" stroke-width="2"/>
  <text x="665" y="466" fill="#f87171" font-size="16" text-anchor="middle" font-weight="700">⑥ RSEG final gate (one consistent DB read)</text>
  <text x="665" y="488" fill="#f5d0d0" font-size="12.5" text-anchor="middle">docs active · same version · same ACL version · user allowed</text>
  <text x="665" y="508" fill="#f5d0d0" font-size="12.5" text-anchor="middle">changed → DISCARD answer → regenerate, else DENY</text>
  <text x="665" y="527" fill="#f5d0d0" font-size="12.5" text-anchor="middle">then citation check · leak canary · PII redact/block</text>
  <line x1="780" y1="406" x2="700" y2="438" stroke="#f87171" stroke-width="2" marker-end="url(#r)"/>

  <rect x="930" y="440" width="240" height="100" rx="10" fill="#18223d" stroke="#6d8dff"/>
  <text x="1050" y="470" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">Released answer + citations</text>
  <text x="1050" y="492" fill="#9aa8d0" font-size="12" text-anchor="middle">doc · version · passage</text><text x="1050" y="510" fill="#9aa8d0" font-size="12" text-anchor="middle">cached WITH its dependencies</text>
  <line x1="880" y1="490" x2="928" y2="490" stroke="#9db4ff" stroke-width="2" marker-end="url(#a)"/>

  <rect x="930" y="200" width="240" height="206" rx="10" fill="#18223d" stroke="#6d8dff" stroke-dasharray="5 4"/>
  <text x="1050" y="228" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">Admin changes</text>
  <text x="1050" y="252" fill="#9aa8d0" font-size="12" text-anchor="middle">revoke · replace · remove ·</text><text x="1050" y="269" fill="#9aa8d0" font-size="12" text-anchor="middle">role change</text>
  <text x="1050" y="298" fill="#f87171" font-size="12.5" text-anchor="middle" font-weight="600">bump versions +</text><text x="1050" y="316" fill="#f87171" font-size="12.5" text-anchor="middle" font-weight="600">invalidate dependent cache</text>
  <text x="1050" y="346" fill="#9aa8d0" font-size="12" text-anchor="middle">(and the gate re-checks anyway,</text><text x="1050" y="363" fill="#9aa8d0" font-size="12" text-anchor="middle">even if an invalidation is missed)</text>

  <rect x="30" y="440" width="380" height="100" rx="10" fill="#18223d" stroke="#6d8dff"/>
  <text x="220" y="468" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">Hash-linked audit trail (tamper-evident)</text>
  <text x="220" y="490" fill="#9aa8d0" font-size="12" text-anchor="middle">authz checks, cache events, injection/PII events,</text><text x="220" y="508" fill="#9aa8d0" font-size="12" text-anchor="middle">release/block + reason · no raw text or secrets</text>
  <line x1="448" y1="490" x2="412" y2="490" stroke="#9db4ff" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect x="30" y="200" width="380" height="200" rx="10" fill="#121a2f" stroke="#263353"/>
  <text x="220" y="228" fill="#fff" font-size="14" text-anchor="middle" font-weight="600">Roles (synthetic demo)</text>
  <text x="50" y="256" fill="#cbd5ff" font-size="12.5">employee · hr · finance · legal · administrator</text>
  <text x="50" y="282" fill="#9aa8d0" font-size="12">administrator = management capabilities only,</text><text x="50" y="299" fill="#9aa8d0" font-size="12">not document access (ACL decides).</text>
  <text x="50" y="330" fill="#9aa8d0" font-size="12">Explicit per-user deny overrides role grants.</text>
  <text x="50" y="360" fill="#9aa8d0" font-size="12">Unreadable docs: no title, no existence (404).</text>
</svg>
