<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17150f"/></marker></defs>
<rect x="2" y="2" width="756" height="466" rx="14" fill="#fff" stroke="#c9bd9a" stroke-dasharray="5 4"/><text x="16" y="22" font-size="10.5" font-weight="700" fill="#8f8156">IBM LinuxONE server (s390x, IBM z17) — 148.100.99.19</text>
<rect x="16" y="36" width="150" height="62" rx="10" fill="#faf7ee" stroke="#17150f"/><text x="91" y="60" font-size="12" font-weight="700" text-anchor="middle">Browser UI</text><text x="91" y="76" font-size="9.8" text-anchor="middle" fill="#4a463c">React + TypeScript</text><text x="91" y="89" font-size="9.8" text-anchor="middle" fill="#4a463c">(served as static files)</text>
<rect x="196" y="36" width="238" height="62" rx="10" fill="#faf7ee" stroke="#17150f"/><text x="315" y="60" font-size="12" font-weight="700" text-anchor="middle">FastAPI web server (Python)</text><text x="315" y="76" font-size="9.8" text-anchor="middle" fill="#4a463c">29 API routes · login token = user id only</text><text x="315" y="89" font-size="9.8" text-anchor="middle" fill="#4a463c">runs as service "vaultrag" on port 8000</text>
<line x1="168" y1="67" x2="194" y2="67" stroke="#17150f" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="196" y="122" width="238" height="188" rx="10" fill="#17150f"/><text x="315" y="142" font-size="12" font-weight="700" text-anchor="middle" fill="#f6f0df">Question pipeline  (rag.py)</text>
<g font-size="9.8" fill="#e9e2cc"><text x="210" y="162">1  who is asking? (authz.py)</text><text x="210" y="177">2  saved answer? re-check it (rseg.py)</text><text x="210" y="192">3  allowed documents → search (vectorstore.py)</text><text x="210" y="207">4  remove suspicious text (injection.py)</text><text x="210" y="222">5  AI writes answer (llm.py)</text><text x="210" y="237" font-weight="700" fill="#fff">6  FINAL GATE: re-check every source (rseg.py)</text><text x="210" y="252">7  citations · privacy filter (pii.py)</text><text x="210" y="267">8  save answer with its sources (rseg.py)</text><text x="210" y="282">9  write the diary (audit.py)</text></g>
<line x1="315" y1="100" x2="315" y2="120" stroke="#17150f" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="122" width="150" height="112" rx="10" fill="#faf7ee" stroke="#17150f"/><text x="91" y="142" font-size="12" font-weight="700" text-anchor="middle">Document service</text><text x="91" y="160" font-size="9.8" text-anchor="middle" fill="#4a463c">upload · replace · remove</text><text x="91" y="173" font-size="9.8" text-anchor="middle" fill="#4a463c">extract → chunk → check</text><text x="91" y="186" font-size="9.8" text-anchor="middle" fill="#4a463c">permissions · versions</text><text x="91" y="199" font-size="9.8" text-anchor="middle" fill="#4a463c">(documents.py, extract.py)</text>
<line x1="196" y1="75" x2="168" y2="135" stroke="#17150f" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="16" y="250" width="150" height="60" rx="10" fill="#faf7ee" stroke="#17150f"/><text x="91" y="272" font-size="12" font-weight="700" text-anchor="middle">On-server ML</text><text x="91" y="288" font-size="9.8" text-anchor="middle" fill="#4a463c">scikit-learn, trained at</text><text x="91" y="300" font-size="9.8" text-anchor="middle" fill="#4a463c">startup (ml.py)</text>
<rect x="470" y="122" width="270" height="118" rx="10" fill="#f6f0df" stroke="#17150f"/><text x="605" y="142" font-size="12" font-weight="700" text-anchor="middle">SQLite database — the one source of truth</text><g font-size="9.8" fill="#3b372d" text-anchor="middle"><text x="605" y="160">users · roles · who may read what</text><text x="605" y="173">document versions · permission versions</text><text x="605" y="186">text pieces (chunks) · saved answers + sources</text><text x="605" y="199">settings · audit diary (hash-linked)</text><text x="605" y="216" font-style="italic">backend/data/vaultrag.db</text></g>
<line x1="436" y1="180" x2="468" y2="180" stroke="#17150f" stroke-width="1.5" marker-end="url(#a)"/><line x1="468" y1="196" x2="436" y2="196" stroke="#17150f" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="470" y="262" width="270" height="48" rx="10" fill="#faf7ee" stroke="#17150f"/><text x="605" y="283" font-size="12" font-weight="700" text-anchor="middle">Jupyter AI/ML lab (Docker)</text><text x="605" y="298" font-size="9.8" text-anchor="middle" fill="#4a463c">IBM image · port 38888 · NOT open to the internet</text>
<rect x="16" y="338" width="724" height="2" fill="#e4dcc6"/>
<rect x="470" y="360" width="270" height="86" rx="10" fill="#fff" stroke="#17150f" stroke-dasharray="6 4"/><text x="605" y="381" font-size="12" font-weight="700" text-anchor="middle">Outside the server</text><text x="605" y="398" font-size="9.8" text-anchor="middle" fill="#4a463c">Groq AI service (gpt-oss-120b) receives</text><text x="605" y="411" font-size="9.8" text-anchor="middle" fill="#4a463c">only the passages the user is allowed to see.</text><text x="605" y="427" font-size="9.8" text-anchor="middle" font-style="italic" fill="#4a463c">Local model (Granite) = planned.</text>
<line x1="434" y1="238" x2="470" y2="385" stroke="#17150f" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>
<rect x="16" y="360" width="400" height="86" rx="10" fill="#faf7ee" stroke="#17150f"/><text x="216" y="381" font-size="12" font-weight="700" text-anchor="middle">Who connects</text><text x="216" y="399" font-size="9.8" text-anchor="middle" fill="#4a463c">Team + judges: http://148.100.99.19:8000 (port open)</text><text x="216" y="413" font-size="9.8" text-anchor="middle" fill="#4a463c">Admin/dev: SSH on port 22 with the .pem key</text><text x="216" y="427" font-size="9.8" text-anchor="middle" fill="#4a463c">Tunnel option: ssh -L 8001:127.0.0.1:8000 …</text>
</svg>
