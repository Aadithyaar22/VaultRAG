<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17150f"/></marker></defs>
<g font-size="9.6">
<rect x="6" y="8" width="160" height="92" rx="8" fill="#faf7ee" stroke="#17150f"/><text x="86" y="26" font-weight="700" font-size="11" text-anchor="middle">users</text><text x="16" y="44">id, username, display_name</text><text x="16" y="57">password_hash (PBKDF2)</text><text x="16" y="70">active, <tspan font-weight="700">authz_version</tspan></text><text x="16" y="88" fill="#6b665c">version +1 when roles change</text>
<rect x="6" y="124" width="160" height="58" rx="8" fill="#faf7ee" stroke="#17150f"/><text x="86" y="142" font-weight="700" font-size="11" text-anchor="middle">user_roles</text><text x="16" y="160">user_id, role</text><text x="16" y="173" fill="#6b665c">employee · hr · finance · legal · administrator</text>
<rect x="6" y="206" width="160" height="58" rx="8" fill="#faf7ee" stroke="#17150f"/><text x="86" y="224" font-weight="700" font-size="11" text-anchor="middle">role_capabilities</text><text x="16" y="242">role, capability</text><text x="16" y="255" fill="#6b665c">manage_documents · manage_roles · …</text>
<rect x="212" y="8" width="176" height="104" rx="8" fill="#f6f0df" stroke="#17150f"/><text x="300" y="26" font-weight="700" font-size="11" text-anchor="middle">documents</text><text x="222" y="44">id, title, sensitivity, filename</text><text x="222" y="57" font-weight="700">version, acl_version</text><text x="222" y="70">status (active / removed)</text><text x="222" y="83">injection_flagged, pii_count</text><text x="222" y="100" fill="#6b665c">version +1 on replace · acl +1 on change</text>
<rect x="212" y="134" width="176" height="48" rx="8" fill="#faf7ee" stroke="#17150f"/><text x="300" y="152" font-weight="700" font-size="11" text-anchor="middle">document_acl</text><text x="222" y="168">doc_id, role   (who MAY read)</text>
<rect x="212" y="206" width="176" height="58" rx="8" fill="#faf7ee" stroke="#17150f"/><text x="300" y="224" font-weight="700" font-size="11" text-anchor="middle">document_user_deny</text><text x="222" y="242">doc_id, user_id</text><text x="222" y="255" fill="#6b665c">a "no" that beats any role</text>
<rect x="434" y="8" width="150" height="104" rx="8" fill="#faf7ee" stroke="#17150f"/><text x="509" y="26" font-weight="700" font-size="11" text-anchor="middle">chunks</text><text x="444" y="44">id, doc_id, doc_version</text><text x="444" y="57">text (a ~600-character piece)</text><text x="444" y="70">vector (for search)</text><text x="444" y="83">injection_score, quarantined</text>
<rect x="434" y="134" width="150" height="48" rx="8" fill="#faf7ee" stroke="#17150f"/><text x="509" y="152" font-weight="700" font-size="11" text-anchor="middle">document_versions</text><text x="444" y="168">hash of each version</text>
<rect x="434" y="206" width="150" height="58" rx="8" fill="#f6f0df" stroke="#17150f"/><text x="509" y="224" font-weight="700" font-size="11" text-anchor="middle">answer_cache</text><text x="444" y="242">key, answer, user version</text><text x="444" y="255" fill="#6b665c">a saved answer, never trusted alone</text>
<rect x="610" y="206" width="146" height="58" rx="8" fill="#f6f0df" stroke="#17150f"/><text x="683" y="224" font-weight="700" font-size="11" text-anchor="middle">cache_deps</text><text x="620" y="242">answer → doc, doc version,</text><text x="620" y="255">ACL version, chunk ids</text>
<rect x="610" y="8" width="146" height="104" rx="8" fill="#14120d"/><text x="683" y="26" font-weight="700" font-size="11" text-anchor="middle" fill="#f6f0df">audit_log</text><g fill="#e9e2cc"><text x="620" y="44">seq, ts, event_type</text><text x="620" y="57">request_id, user_id</text><text x="620" y="70">outcome, detail</text><text x="620" y="83" font-weight="700">prev_hash, hash</text><text x="620" y="100" fill="#bdb497">each row seals the one before</text></g>
<rect x="610" y="134" width="146" height="48" rx="8" fill="#faf7ee" stroke="#17150f"/><text x="683" y="152" font-weight="700" font-size="11" text-anchor="middle">settings</text><text x="620" y="168">PII policy (redact/block/off)</text></g>
<g stroke="#17150f" stroke-width="1.2" marker-end="url(#a)"><line x1="86" y1="100" x2="86" y2="122"/><line x1="86" y1="182" x2="86" y2="204" stroke-dasharray="3 3"/><line x1="300" y1="112" x2="300" y2="132"/><line x1="300" y1="182" x2="300" y2="204"/><line x1="388" y1="60" x2="432" y2="60"/><line x1="388" y1="155" x2="432" y2="155"/><line x1="584" y1="235" x2="608" y2="235"/></g>
<text x="380" y="300" font-size="10.4" text-anchor="middle" font-weight="700">Permissions come ONLY from these tables. The vector search filter is never trusted on its own.</text>
</svg>
