<svg viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17150f"/></marker></defs>
<g font-size="12" text-anchor="middle">
<rect x="4" y="34" width="106" height="84" rx="12" fill="#faf7ee" stroke="#17150f"/><text x="57" y="62" font-weight="700" font-size="13">1 · Ask</text><text x="57" y="82" font-size="10.5" fill="#4a463c">You type a</text><text x="57" y="96" font-size="10.5" fill="#4a463c">question</text>
<rect x="132" y="34" width="106" height="84" rx="12" fill="#faf7ee" stroke="#17150f"/><text x="185" y="62" font-weight="700" font-size="13">2 · Check badge</text><text x="185" y="82" font-size="10.5" fill="#4a463c">What may this</text><text x="185" y="96" font-size="10.5" fill="#4a463c">person read?</text>
<rect x="260" y="34" width="106" height="84" rx="12" fill="#faf7ee" stroke="#17150f"/><text x="313" y="62" font-weight="700" font-size="13">3 · Find pages</text><text x="313" y="82" font-size="10.5" fill="#4a463c">Search ONLY the</text><text x="313" y="96" font-size="10.5" fill="#4a463c">allowed pages</text>
<rect x="388" y="34" width="106" height="84" rx="12" fill="#faf7ee" stroke="#17150f"/><text x="441" y="62" font-weight="700" font-size="13">4 · Write</text><text x="441" y="82" font-size="10.5" fill="#4a463c">AI writes an</text><text x="441" y="96" font-size="10.5" fill="#4a463c">answer + sources</text>
<rect x="516" y="34" width="116" height="84" rx="12" fill="#17150f"/><text x="574" y="62" font-weight="700" font-size="13" fill="#f6f0df">5 · Last check</text><text x="574" y="82" font-size="10.5" fill="#d9d1bb">Is everything still</text><text x="574" y="96" font-size="10.5" fill="#d9d1bb">allowed? Re-check</text>
<rect x="654" y="34" width="102" height="84" rx="12" fill="#f6f0df" stroke="#17150f"/><text x="705" y="62" font-weight="700" font-size="13">6 · Show</text><text x="705" y="82" font-size="10.5" fill="#4a463c">or block, and</text><text x="705" y="96" font-size="10.5" fill="#4a463c">write the diary</text></g>
<g stroke="#17150f" stroke-width="1.6" marker-end="url(#a)"><line x1="112" y1="76" x2="130" y2="76"/><line x1="240" y1="76" x2="258" y2="76"/><line x1="368" y1="76" x2="386" y2="76"/><line x1="496" y1="76" x2="514" y2="76"/><line x1="634" y1="76" x2="652" y2="76"/></g>
<text x="574" y="142" font-size="10.5" text-anchor="middle" font-style="italic" fill="#4a463c">If anything changed: throw the answer away,</text><text x="574" y="156" font-size="10.5" text-anchor="middle" font-style="italic" fill="#4a463c">try again with what is allowed now, or say no.</text>
</svg>
